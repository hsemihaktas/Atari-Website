<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#e8e7e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d10" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8e7e3" />
    <title>Rewosama — Tasarımcı & Geliştirici</title>
    <meta
      name="description"
      content="Tasarım ve kodu bir arada yürüten bir ürün tasarımcısı. Seçili işler, denemeler ve notlar."
    />
    <meta property="og:title" content="Rewosama — Tasarımcı & Geliştirici" />
    <meta
      property="og:description"
      content="Tasarım ve kodu bir arada yürüten bir ürün tasarımcısı. Seçili işler, denemeler ve notlar."
    />
    <meta property="og:type" content="website" />
    <script>
      // Sayfa boyanmadan önce temayı uygula (flash olmasın)
      ;(() => {
        try {
          const saved = localStorage.getItem('rewosama-theme')
          const dark = saved
            ? saved === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
